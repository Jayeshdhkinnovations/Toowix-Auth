# Inherit Keycloak 26.7.4's supported v2 login templates and authentication flow.
parent=keycloak.v2
styles=css/styles.css css/toowix.css

# Use the Toowix mark for every login-theme page that is rendered by an
# inherited Keycloak template as well as the custom Toowix pages.
favicons.svg=img/brand-mark.svg

# Do not cache templates or static theme files in development.  Remove these
# two lines for a production image if normal Keycloak theme caching is wanted.
cacheTemplates=false
cacheTheme=false
